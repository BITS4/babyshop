name: Feature request
description: Propose a focused, testable improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
      description: Describe observable acceptance criteria rather than an implementation preference.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Test evidence
      description: Which unit, integration, or manual scenarios should prove the behavior?
